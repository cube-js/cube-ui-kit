name: Pull Request
on:
  pull_request:
    paths-ignore:
      - '.changeset/**'
      - '.husky/**'

concurrency:
  group: ci-pull-request=${{github.ref}}-1
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

# Note: Canary publishing is handled by publish.yml workflow

jobs:
  tests:
    name: 'Tests & lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm pinned by `packageManager` — the same field pnpm reads
      # to switch itself locally, so CI and a contributor cannot drift apart.
      # Must precede `setup-node`, whose `cache: 'pnpm'` needs `pnpm` on PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run the lint
        run: pnpm lint

      - name: Run the tests
        run: pnpm test

      - name: Verify the modern Form store without React or DOM setup
        run: pnpm test:form-store

      - name: Type check the Form type fixtures (and their import graph)
        run: pnpm test:types

      - name: Build the package
        run: pnpm build

      - name: Type check the consumer fixtures against the built declarations
        run: pnpm test:types:consumer

      - name: Check the Form compiler diagnostics ratchet
        run: pnpm diagnostics:form --check

      - name: Check whole-library Compiler coverage
        run: pnpm diagnostics:compiler

  form-react:
    name: 'React Compiler / React ${{ matrix.react }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Separate jobs keep the normal lockfile gate on React 19 and exercise
      # real React 18 peers without aliases or a second React runtime.
      - name: Install the React 18 consumer matrix
        if: matrix.react == 18
        run: pnpm add -D --save-exact react@18.3.1 react-dom@18.3.1 react-test-renderer@18.3.1
      - name: Verify selectors, root scopes, Strict Mode, and hydration
        run: pnpm test:form-react
      - name: Verify the same modern Form contract with React Compiler
        run: pnpm test:form-compiled
      - name: Verify all components with the release compiler transform
        run: pnpm test:compiled --maxWorkers=2
      - name: Build and pack the compiled library
        run: pnpm build && pnpm pack:test
      - name: Verify packed output with compiled and uncompiled consumers
        run: pnpm test:package
      - name: Verify the uncompiled build as a behavior baseline
        run: pnpm build:uncompiled && UIKIT_TEST_UNCOMPILED=1 pnpm test:package
      - name: Upload compilation coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-compiler-${{ matrix.react }}
          path: dist/react-compiler-report.json

  browser-tests:
    name: 'Browser tests / React ${{ matrix.react }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: 19
          # React 18 Strict Mode replays effects without re-attaching refs,
          # which only a real browser measuring real labels can catch in
          # `useAutoTooltip` and its consumers. The rest of the suite is not
          # green on React 18 yet (ItemTable's treegrid focus test fails on
          # main too), so this run is scoped to `content` until it is.
          - react: 18
            specs: src/components/content
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm pinned by `packageManager` — the same field pnpm reads
      # to switch itself locally, so CI and a contributor cannot drift apart.
      # Must precede `setup-node`, whose `cache: 'pnpm'` needs `pnpm` on PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install the React 18 consumer matrix
        if: matrix.react == 18
        run: pnpm add -D --save-exact react@18.3.1 react-dom@18.3.1 react-test-renderer@18.3.1

      # Cached by Playwright's own version, so a browser is only downloaded when
      # the dependency actually changes rather than on every run.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # `--with-deps` pulls the system libraries the browser needs on a bare
      # runner. Only the binary is cached, so this still runs on a cache hit —
      # it is a no-op when the libraries are already present.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the browser tests
        run: pnpm test:browser ${{ matrix.specs }}
      - name: Run the browser tests with the release compiler transform
        run: UIKIT_REACT_COMPILER=on pnpm test:browser ${{ matrix.specs }}

  deploy-chromatic:
    name: 'Prepare Storybook for review & tests'
    runs-on: ubuntu-latest
    environment:
      name: Chromatic staging
      url: ${{ steps.publish_chromatic.outputs.url }}
    env:
      CHROMATIC_RETRIES: 5
      LOG_LEVEL: 'error'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        name: Download storybook cache
        with:
          path: |
            **/node_modules/.cache
          key: ${{ runner.os }}-storybook-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-storybook

      # Installs the pnpm pinned by `packageManager` — the same field pnpm reads
      # to switch itself locally, so CI and a contributor cannot drift apart.
      # Must precede `setup-node`, whose `cache: 'pnpm'` needs `pnpm` on PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Built here rather than inside `chromaui/action` so the same output can
      # be checked before it is uploaded. `--stats-json` writes the module graph
      # TurboSnap traces (`onlyChanged`), which is also what the budget check
      # below reads.
      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Fails when the set of files that force a *full* Chromatic build grows —
      # one barrel import inside the Root decorator's dependency tree is enough
      # to turn every PR into a 1000-snapshot build, and nothing else would
      # notice. See scripts/chromatic-report.mjs.
      - name: Check Chromatic snapshot budget
        run: pnpm chromatic:check

      - name: Publish to Chromatic
        id: publish_chromatic
        uses: chromaui/action@v11
        with:
          exitZeroOnChanges: true
          exitOnceUploaded: true
          onlyChanged: true
          debug: true
          storybookBuildDir: storybook-static
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      # Announcing the deploy is not the check: `Publish to Chromatic` above
      # has already uploaded and reported its own outcome. A 503 from the
      # issues API here used to fail the job after all the real work passed.
      - name: Comment PR
        uses: actions/github-script@v6
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const setMessage = require('${{ github.workspace }}/scripts/ci/set-message.cjs')

            await setMessage({
              header: "## 🧪 Storybook is successfully deployed!",
              body: `
                - 👀 Review changes: ${{ steps.publish_chromatic.outputs.url }}
                - 👨‍🎨 Preview storybook: ${{ steps.publish_chromatic.outputs.storybookUrl }}
              `,
              github,
              repo: context.repo,
              prNumber: context.payload.pull_request.number
            })
