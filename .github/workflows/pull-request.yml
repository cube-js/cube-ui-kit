name: Pull Request
# No `paths-ignore`: a workflow skipped by a path filter leaves its required
# checks pending, so a PR of changesets alone could never merge. `plan` below
# skips the jobs such a PR does not need instead.
on:
  pull_request:

concurrency:
  group: ci-pull-request=${{github.ref}}-1
  cancel-in-progress: true

permissions:
  actions: read # `plan` lists this PR's pass markers, which are cache entries
  contents: read
  issues: write
  pull-requests: write
  statuses: write

# Note: Canary publishing is handled by publish.yml workflow

# The Version Packages PR (`changeset-release/main`) changes only versions,
# changelogs and spent changesets. `main` takes only PRs that are up to date and
# green, so its code is exactly what the last merged PR already tested here, and
# the test jobs skip it rather than test the same tree again. The required
# aggregate accepts those skips only for this explicit release-PR policy;
# `skip-chromatic` reports the required `UI Tests` and `UI Review` statuses.
# `Build & canary release` (publish.yml) still builds the tree about to ship.

# Every job but the lint first asks `plan` whether this run needs it
# (scripts/ci/plan-jobs.mjs, which explains each decision in the run summary).
# A job is skipped when the PR changes no file it reads, or when it already
# passed on exactly these inputs in an earlier run of this PR. `Tests & lint`
# accepts only the skips the plan made. The jobs use `!cancelled()` rather
# than the implicit `success()`, so when the planner itself fails, they run.

jobs:
  # A few seconds: the runner's own Node, no install. The checkout is the
  # merge commit and its first parent (the base branch tip), whose difference
  # is what this PR changes.
  plan:
    name: 'Plan the jobs this change affects'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      compiled-tests: ${{ steps.plan.outputs.compiled-tests }}
      form-react: ${{ steps.plan.outputs.form-react }}
      browser-tests: ${{ steps.plan.outputs.browser-tests }}
      a11y: ${{ steps.plan.outputs.a11y }}
      chromatic: ${{ steps.plan.outputs.chromatic }}
      marker-tests: ${{ steps.plan.outputs.marker-tests }}
      marker-compiled-tests: ${{ steps.plan.outputs.marker-compiled-tests }}
      marker-form-react: ${{ steps.plan.outputs.marker-form-react }}
      marker-browser-tests: ${{ steps.plan.outputs.marker-browser-tests }}
      marker-a11y: ${{ steps.plan.outputs.marker-a11y }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Plan the jobs
        id: plan
        run: node scripts/ci/plan-jobs.mjs tests compiled-tests form-react browser-tests a11y chromatic
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The suites are split into shards because each one alone used to set the
  # length of the whole run: the jsdom suite took ~6.5 minutes and every
  # other check queued behind it in one job. Shards also make a flaky rerun
  # cost one shard rather than the full suite. `--shard` splits by test file,
  # so the shards are only roughly even.
  tests:
    name: 'Source tests (${{ matrix.shard }}/3)'
    needs: plan
    if: ${{ !cancelled() && github.head_ref != 'changeset-release/main' && needs.plan.outputs.tests != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm pinned by `packageManager` — the same field pnpm reads
      # to switch itself locally, so CI and a contributor cannot drift apart.
      # Must precede `setup-node`, whose `cache: 'pnpm'` needs `pnpm` on PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the tests
        run: pnpm test --shard=${{ matrix.shard }}/3

  static-checks:
    name: 'Lint, types & diagnostics'
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the lint
        run: pnpm lint

      # Here rather than in a spec: a PR that changes only docs pages runs no
      # test job, and a docs edit can drop the mention a token relies on.
      - name: Check every published component token is documented
        run: pnpm check:component-tokens

      - name: Verify the modern Form store without React or DOM setup
        run: pnpm test:form-store

      - name: Type check the Form type fixtures (and their import graph)
        run: pnpm test:types

      - name: Check whole-library Hooks diagnostics and strict Effect Events
        run: pnpm diagnostics:hooks --check

      - name: Check the Form view of the shared Hooks baseline
        run: pnpm diagnostics:form --check

      - name: Check whole-library Compiler coverage
        run: pnpm diagnostics:compiler

  form-react:
    name: 'React Compiler / Form & package'
    needs: plan
    if: ${{ !cancelled() && github.head_ref != 'changeset-release/main' && needs.plan.outputs.form-react != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify selectors, root scopes, Strict Mode, and hydration
        run: pnpm test:form-react
      - name: Verify the same modern Form contract with React Compiler
        run: pnpm test:form-compiled
      - name: Build the package
        run: pnpm build
      - name: Verify React peers and native compiler package output
        run: pnpm check:react-package
      - name: Type check the consumer fixtures against the built declarations
        run: pnpm test:types:consumer
      - name: Pack the compiled library
        run: pnpm pack:test
      - name: Verify a consumer can emit declarations for tasty() extensions
        run: pnpm check:consumer-declarations
      - name: Verify packed output with compiled and uncompiled consumers
        run: pnpm test:package
      - name: Verify the uncompiled build as a behavior baseline
        run: pnpm build:uncompiled && UIKIT_TEST_UNCOMPILED=1 pnpm test:package
      - name: Upload compilation coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-compiler-package
          path: dist/react-compiler-report.json

  # The full jsdom suite through the release compiler transform, sharded like
  # `tests` above (~8 minutes in one job).
  compiled-tests:
    name: 'React Compiler / All components (${{ matrix.shard }}/3)'
    needs: plan
    if: ${{ !cancelled() && github.head_ref != 'changeset-release/main' && needs.plan.outputs.compiled-tests != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify all components with the release compiler transform
        run: pnpm test:compiled --maxWorkers=2 --shard=${{ matrix.shard }}/3

  browser-tests:
    name: 'Browser tests / Compiler ${{ matrix.compiler }} (${{ matrix.shard }}/2)'
    needs: plan
    if: ${{ !cancelled() && github.head_ref != 'changeset-release/main' && needs.plan.outputs.browser-tests != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Uncompiled source and the release compiler transform, each split in
        # two: a whole run of the suite takes ~7.5 minutes.
        compiler: ['off', 'on']
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm pinned by `packageManager` — the same field pnpm reads
      # to switch itself locally, so CI and a contributor cannot drift apart.
      # Must precede `setup-node`, whose `cache: 'pnpm'` needs `pnpm` on PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        uses: ./.github/actions/install-chromium

      - name: Run the browser tests (compiler ${{ matrix.compiler }})
        run: pnpm test:browser --shard=${{ matrix.shard }}/2
        env:
          UIKIT_REACT_COMPILER: ${{ matrix.compiler }}

  # Every story rendered in real Chromium and checked with axe-core against the
  # per-story baseline in `scripts/a11y-baseline.json`. A job of its own rather
  # than a step after the Chromatic build, so a new violation never holds up
  # visual review. Split in three because the whole check alone took ~8
  # minutes; each shard builds Storybook itself (under a minute) rather than
  # waiting for one build to be handed over.
  a11y:
    name: 'Accessibility (axe) (${{ matrix.shard }}/3)'
    needs: plan
    if: ${{ !cancelled() && github.head_ref != 'changeset-release/main' && needs.plan.outputs.a11y != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        uses: ./.github/actions/install-chromium

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # One page per core of the runner: the settle waits are timed, and an
      # oversubscribed runner only sends more stories to the confirming rerun.
      - name: Check stories against the accessibility baseline
        run: pnpm diagnostics:a11y --check --concurrency 4 --shard ${{ matrix.shard }}/3

  required-tests:
    name: 'Tests & lint'
    needs:
      [
        plan,
        tests,
        static-checks,
        form-react,
        compiled-tests,
        browser-tests,
        a11y,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pass markers: for each job that passed, an empty cache entry named
      # after the hash of its inputs, so a later push that leaves them alone
      # skips the job. Saved here rather than in the jobs, because only this
      # job sees a matrix job's result across all of its shards. A marker is
      # an optimisation: one that fails to save costs a rerun, never a check.
      - name: Prepare the pass marker
        run: touch .ci-pass
      - name: Record that the source tests passed on these inputs
        if: needs.tests.result == 'success' && needs.plan.outputs.marker-tests != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.marker-tests }}
      - name: Record that the compiled tests passed on these inputs
        if: needs.compiled-tests.result == 'success' && needs.plan.outputs.marker-compiled-tests != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.marker-compiled-tests }}
      - name: Record that the Form & package checks passed on these inputs
        if: needs.form-react.result == 'success' && needs.plan.outputs.marker-form-react != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.marker-form-react }}
      - name: Record that the browser tests passed on these inputs
        if: needs.browser-tests.result == 'success' && needs.plan.outputs.marker-browser-tests != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.marker-browser-tests }}
      - name: Record that the accessibility check passed on these inputs
        if: needs.a11y.result == 'success' && needs.plan.outputs.marker-a11y != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.marker-a11y }}

      - name: Require every supported execution and consumer mode
        run: node scripts/ci/check-required-jobs.cjs
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
          PR_BRANCH: ${{ github.head_ref }}

  # Planned by the PR's files only, never by a pass marker: see
  # `skip-chromatic` below.
  deploy-chromatic:
    name: 'Prepare Storybook for review & tests'
    needs: plan
    if: ${{ !cancelled() && github.head_ref != 'changeset-release/main' && needs.plan.outputs.chromatic != 'false' }}
    runs-on: ubuntu-latest
    environment:
      name: Chromatic staging
      url: ${{ steps.publish_chromatic.outputs.url }}
    env:
      CHROMATIC_RETRIES: 5
      LOG_LEVEL: 'error'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        name: Download storybook cache
        with:
          path: |
            **/node_modules/.cache
          key: ${{ runner.os }}-storybook-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-storybook

      # Installs the pnpm pinned by `packageManager` — the same field pnpm reads
      # to switch itself locally, so CI and a contributor cannot drift apart.
      # Must precede `setup-node`, whose `cache: 'pnpm'` needs `pnpm` on PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Built here rather than inside `chromaui/action` so the same output can
      # be checked before it is uploaded. `--stats-json` writes the module graph
      # TurboSnap traces (`onlyChanged`), which is also what the budget check
      # below reads.
      - name: Build Storybook
        run: pnpm build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Fails when the set of files that force a *full* Chromatic build grows —
      # one barrel import inside the Root decorator's dependency tree is enough
      # to turn every PR into a 1000-snapshot build, and nothing else would
      # notice. See scripts/chromatic-report.mjs.
      - name: Check Chromatic snapshot budget
        run: pnpm chromatic:check

      - name: Publish to Chromatic
        id: publish_chromatic
        uses: chromaui/action@v11
        with:
          exitZeroOnChanges: true
          exitOnceUploaded: true
          onlyChanged: true
          debug: true
          storybookBuildDir: storybook-static
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      # Announcing the deploy is not the check: `Publish to Chromatic` above
      # has already uploaded and reported its own outcome. A 503 from the
      # issues API here used to fail the job after all the real work passed.
      - name: Comment PR
        uses: actions/github-script@v6
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const setMessage = require('${{ github.workspace }}/scripts/ci/set-message.cjs')

            await setMessage({
              header: "## 🧪 Storybook is successfully deployed!",
              body: `
                - 👀 Review changes: ${{ steps.publish_chromatic.outputs.url }}
                - 👨‍🎨 Preview storybook: ${{ steps.publish_chromatic.outputs.storybookUrl }}
              `,
              github,
              repo: context.repo,
              prNumber: context.payload.pull_request.number
            })

  # Chromatic's own statuses, `UI Tests` and `UI Review`, are required checks,
  # so a PR cannot simply go without a build: `skip` records the commit as
  # passing instead. Two kinds of PR take it:
  #
  # - The Version Packages PR. A real build there is pure cost. Nobody
  #   reviews it, the build that follows the release on main photographs the
  #   same tree, and it has run with TurboSnap disabled, snapshotting all ~1100
  #   stories.
  # - A PR that changes nothing Storybook shows (specs, scripts' baselines,
  #   repository notes). TurboSnap would still re-capture every story `main`
  #   changed since its last release build, and bill a fifth of a snapshot
  #   for each of the rest.
  #
  # Only the PR's files decide this. Skipping a later push of a PR because it
  # left Storybook's inputs alone would pass visual changes an earlier push
  # left unreviewed.
  skip-chromatic:
    name: 'Skip Storybook review'
    needs: plan
    if: ${{ !cancelled() && (github.head_ref == 'changeset-release/main' || needs.plan.outputs.chromatic == 'false') }}
    runs-on: ubuntu-latest
    steps:
      # Full history, as for a real build: Chromatic reads the PR head commit's
      # details from git before it decides to skip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark the commit as passing in Chromatic
        uses: chromaui/action@v11
        with:
          skip: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
