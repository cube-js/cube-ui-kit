name: Install Chromium
description: Playwright's Chromium and the system packages it needs, both cached, for the jobs that render in a real browser.

runs:
  using: composite
  steps:
    # Cached by Playwright's own version, so a browser is only downloaded when
    # the dependency actually changes rather than on every run.
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

    # `--with-deps` installs about 26 MB of system packages (mostly fonts)
    # through apt on every run: the runner image does not have them, and the
    # browser cache above does not hold them. The runner's Ubuntu mirror
    # sometimes serves them at ~90 kB/s, which has held this step for up to 15
    # minutes. So apt keeps what it downloads in a cached directory, and on a
    # hit it only fetches packages that changed upstream since. The packages,
    # and so the fonts every layout depends on, are still exactly the ones
    # `--with-deps` picks.
    - name: Resolve Ubuntu release
      id: os
      shell: bash
      run: echo "release=$(. /etc/os-release && echo "$VERSION_ID")" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: ~/.cache/playwright-apt/*.deb
        key: ${{ runner.os }}-ubuntu-${{ steps.os.outputs.release }}-playwright-apt-${{ steps.playwright.outputs.version }}

    # `partial/` is apt's download area and has to exist. apt downloads as
    # root, so its sandbox user `_apt` never needs to reach a directory in the
    # runner's home.
    #
    # On a cache miss apt needs the image's Ubuntu mirror. On 2026-11-11 no
    # *.ubuntu.com name resolved on the runners for hours while other hosts
    # did, and apt spent ten minutes on retries before failing the job. So when
    # the mirror's name doesn't resolve, apt uses a mirror outside ubuntu.com
    # instead: the same packages, signed with the same Ubuntu key. GitHub's
    # images list their mirrors in /etc/apt/apt-mirrors.txt, which the sources
    # name as `mirror+file:`, so that file is rewritten along with them.
    - name: Install Chromium
      shell: bash
      run: |
        mkdir -p ~/.cache/playwright-apt/partial
        printf 'Dir::Cache::Archives "%s";\nAPT::Sandbox::User "root";\n' "$HOME/.cache/playwright-apt" \
          | sudo tee /etc/apt/apt.conf.d/90-playwright-cache > /dev/null
        files=()
        for file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
          if [ -f "$file" ]; then files+=("$file"); fi
        done
        mirror=$(grep -m 1 -hoE 'https?://[^/[:space:]]+\.ubuntu\.com' "${files[@]}" /dev/null | sed -En '1{s#^https?://##;p;q}' || true)
        if [ -n "$mirror" ] && ! getent hosts "$mirror" > /dev/null; then
          echo "::warning::$mirror does not resolve, so apt uses mirrors.kernel.org"
          sudo sed -i -E 's#https?://([a-z0-9-]+\.)*ubuntu\.com/ubuntu/?#http://mirrors.kernel.org/ubuntu/#g' "${files[@]}"
        fi
        pnpm exec playwright install --with-deps chromium
